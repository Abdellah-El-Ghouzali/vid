name: Build Video

on:
  push:
    paths:
      - "video.mp4"
      - "process.py"
      - "requirements.txt"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-video:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify dependencies
        run: |
          python -c "import cv2, numpy, zstandard; print('OpenCV:', cv2.__version__); print('NumPy:', numpy.__version__); print('Zstandard:', zstandard.__version__)"

      - name: Verify video
        run: |
          test -f video.mp4
          ls -lh video.mp4

      - name: Process video
        run: |
          python process.py

      - name: Verify output
        run: |
          test -f chunks/180p/manifest.json
          find chunks -type f | sort
          echo ""
          echo "Output size:"
          du -sh chunks

      - name: Commit generated chunks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add chunks/

          if git diff --cached --quiet; then
            echo "No generated changes."
          else
            git commit -m "Regenerate video chunks"
            git push
          fi
