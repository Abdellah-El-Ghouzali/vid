name: Build Video

on:
  push:
    paths:
      - "video.mp4"
      - "process.py"

  workflow_dispatch:

jobs:
  build-video:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install opencv-python-headless numpy zstandard

      - name: Process Video
        run: |
          python process.py

      - name: Commit generated chunks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add chunks/

          git commit -m "Generate video chunks" || true

          git push
