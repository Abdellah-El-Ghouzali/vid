name: Build Video

on:
  push:
    paths:
      - "videos/**"
      - "video.mp4"
      - "process.py"
      - "requirements.txt"
      - ".github/workflows/build-video.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-video-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-video:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install dependencies
        run: |
          python -m pip install \
            --disable-pip-version-check \
            --prefer-binary \
            opencv-python-headless numpy zstandard

      - name: Process all videos
        run: |
          python process.py

      - name: Commit and push generated chunks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Stage new, modified, and deleted segments cleanly
          git add -A videos/
          git add -A chunks/

          if git diff --cached --quiet; then
            echo "No changes detected in chunks."
          else
            git commit -m "Generate streaming chunks for videos [skip ci]"
            git pull --rebase origin ${{ github.ref_name }} || true
            git push
          fi
