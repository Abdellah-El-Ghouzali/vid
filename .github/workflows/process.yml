name: Build Video

on:
  push:
    paths:
      - "video.mp4"
      - "process.py"
      - "requirements.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-video:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4  # Fixed from v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Headless OpenCV installs 3x faster
          python -m pip install opencv-python-headless numpy zstandard

      - name: Process video
        run: |
          python process.py

      - name: Verify output
        run: |
          test -f chunks/576p/manifest.json
          du -sh chunks

      - name: Commit generated video
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chunks/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Fast streaming video build [skip ci]"
            git push
          fi
