name: Build Video

on:
  push:
    paths:
      - "videos/**"
      - "video.mp4"
      - "process.py"
      - "requirements.txt"
      - ".github/workflows/build-video.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-video-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-video:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          else
            python -m pip install --prefer-binary opencv-python-headless numpy zstandard
          fi

      - name: Process and compress all videos
        run: |
          python process.py

      - name: Commit and push generated chunks & bundles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Stage modified chunks and bundles inside videos/
          git add -A videos/

          if git diff --cached --quiet; then
            echo "No changes detected."
          else
            git commit -m "Optimize video chunks and bundles (v4) [skip ci]"
            git pull --rebase origin ${{ github.ref_name }} || true
            git push
          fi
