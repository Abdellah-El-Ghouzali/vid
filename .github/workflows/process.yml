name: Build Video

on:
  push:
    paths:
      - "video.mp4"
      - "process.py"

  workflow_dispatch:

jobs:
  build-video:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install opencv-python-headless numpy zstandard

      - name: Verify dependencies
        run: |
          python -c "import cv2, numpy, zstandard; print('OpenCV:', cv2.__version__); print('NumPy:', numpy.__version__); print('Zstandard:', zstandard.__version__)"

      - name: Process Video
        run: |
          python process.py

      - name: Check output
        run: |
          echo "Generated files:"
          find chunks -type f | sort
          echo ""
          echo "Output size:"
          du -sh chunks

      - name: Commit generated chunks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add chunks/

          git diff --cached --quiet || git commit -m "Generate video chunks"

          git push
