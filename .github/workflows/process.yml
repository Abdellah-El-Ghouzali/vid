name: Build Videos

on:
  push:
    paths:
      - "videos/**"
      - "process.py"
      - "requirements.txt"
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Force rebuild all videos'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-videos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-videos:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check --prefer-binary \
            opencv-python-headless numpy zstandard

      - name: Process videos
        run: |
          if [ "${{ github.event.inputs.force_rebuild }}" = "true" ]; then
            python process.py --force
          else
            python process.py
          fi

      - name: Verify output
        run: |
          test -f chunks/index.json
          echo "Output summary:"
          du -sh chunks/*

      - name: Commit and push generated chunks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A chunks/

          if git diff --cached --quiet; then
            echo "No changes in chunks to commit."
          else
            git commit -m "Auto-generate video chunks [skip ci]"
            git pull --rebase origin ${{ github.ref_name }} || true
            git push
          fi
